name: Build upstream releases

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many of the newest releases to consider, or 'taste' to thin the whole history toward the past"
        required: false
        default: "3"

permissions:
  contents: write
  pages: write

concurrency: build

env:
  UP: ad-si/Woxi
  APP: woxi
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Find releases we don't have yet
        run: |
          : > todo.txt
          if [ "${{ inputs.limit || '3' }}" = taste ]; then
            tags=$(gh release list -R "$UP" --limit 400 --exclude-drafts --exclude-pre-releases --json tagName,publishedAt | python3 scripts/pick.py)
          else
            tags=$(gh release list -R "$UP" --limit "${{ inputs.limit || '3' }}" --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName')
          fi
          for tag in $tags; do
            [ -d "v${tag#v}" ] || echo "$tag" >> todo.txt
          done
          cat todo.txt
          if [ -s todo.txt ]; then echo "NEED=true" >> "$GITHUB_ENV"; fi

      - uses: dtolnay/rust-toolchain@stable
        if: env.NEED == 'true'
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        if: env.NEED == 'true'
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build each new release
        if: env.NEED == 'true'
        run: |
          # One clone for every tag, so the Rust build cache (target/) carries over between releases.
          git clone --quiet --filter=blob:none "https://github.com/$UP.git" up
          while read -r tag; do
            ver="${tag#v}"
            echo "::group::Build $tag"
            git -C up clean -fdxq -e target
            git -C up checkout --quiet --force "tags/$tag" || { echo "::warning::could not check out $tag"; continue; }
            if [ ! -d up/tests/landing ]; then echo "::warning::$tag has no browser playground, skipping"; continue; fi
            # The browser playground is the project's landing page plus its WebAssembly build (what its own website serves).
            if (cd up && wasm-pack build -d tests/playground/pkg --target web --release -- --no-default-features --features wasm) && [ -f up/tests/playground/pkg/woxi_bg.wasm ]; then
              mkdir "v$ver"
              cp -a up/tests/landing/. "v$ver/"
              cp -a up/tests/playground/pkg "v$ver/pkg"
              rm -f "v$ver/pkg/.gitignore" "v$ver/pkg/package.json" "v$ver/pkg/README.md"
              cp up/tests/cli/favicon.png "v$ver/favicon.png" 2>/dev/null || true
              # Pages that point at the project's own site root: send them to the author's site, except the favicon.
              sed -i -e 's#href="/favicon.png"#href="favicon.png"#'                      -e 's#href="/\(docs\|jupyterlite\|playground\)#href="https://woxi.ad-si.com/\1#g' "v$ver/index.html"
              cp up/license.txt "v$ver/" 2>/dev/null || cp up/LICENSE* "v$ver/" 2>/dev/null || true
              printf 'Built from %s at tag %s\nhttps://github.com/%s/tree/%s\nBuilt with the project'"'"'s own wasm-pack release build. Only change: links to the project'"'"'s docs, notebook and full playground point at woxi.ad-si.com.\n' "$UP" "$tag" "$UP" "$tag" > "v$ver/SOURCE.txt"
            else
              echo "::warning::build failed for $tag"
            fi
            echo "::endgroup::"
          done < todo.txt
          rm -rf up

      - name: Record versions that could not be hosted
        run: bash scripts/skip.sh sync todo.txt

      - name: Update latest and versions.json
        run: |
          versions=$(find . -maxdepth 1 -type d -name 'v[0-9]*' -printf '%f\n' | sed 's/^v//' | sort -rV)
          [ -n "$versions" ] || { echo "No versions built"; exit 0; }
          latest=$(echo "$versions" | head -n1)
          mkdir -p latest
          printf '<!doctype html><meta charset="utf-8"><title>%s</title><meta http-equiv="refresh" content="0; url=../v%s/"><link rel="canonical" href="../v%s/"><a href="../v%s/">Open %s %s</a>\n' "$APP" "$latest" "$latest" "$latest" "$APP" "$latest" > latest/index.html
          echo "$versions" | jq -R . | jq -s --arg latest "$latest" '{latest: $latest, versions: .}' > versions.json
          cat versions.json

      - name: Keep the site under its size cap
        run: bash scripts/prune.sh

      - name: Commit and request a Pages build
        run: |
          rm -f todo.txt
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add upstream release builds"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
